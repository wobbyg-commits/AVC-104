<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>flashcards — Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#F3F0E7;--paper-alt:#ECE6D6;--card:#FFFFFF;--ink:#23201A;--ink-soft:#5B564A;--accent:#145A4A;--accent-dark:#0E463A;--accent-tab:#8B3A2F;--rule:#D9D2C1;--focus:#0E463A;--radius:10px;font-size:16px;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--paper);color:var(--ink);font-family:'Public Sans',system-ui,sans-serif;line-height:1.5;min-height:100vh;}
h1{font-family:'Public Sans',system-ui,sans-serif;font-weight:800;letter-spacing:-.01em;margin:0 0 .3em;}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.02em;}
.skip-link{position:absolute;left:-999px;top:0;background:var(--accent-dark);color:#fff;padding:.75em 1.25em;z-index:100;border-radius:0 0 8px 0;font-weight:600;}
.skip-link:focus{left:0;}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;}
header.top{border-bottom:2px solid var(--ink);padding:1.75rem 1.5rem 1.25rem;max-width:700px;margin:0 auto;}
header.top .eyebrow{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-dark);background:var(--paper-alt);border:1px solid var(--rule);padding:.2em .6em;border-radius:4px;margin-bottom:.6rem;}
main{max-width:700px;margin:0 auto;padding:1.5rem;}
.deck-meta{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.6rem;margin-bottom:1rem;}
.stage{perspective:1400px;max-width:560px;margin:0 auto 1.25rem;}
.card-face{position:relative;width:100%;min-height:260px;border-radius:var(--radius);background:transparent;border:none;padding:0;cursor:pointer;display:block;}
.card-inner{display:block;position:relative;width:100%;height:100%;min-height:260px;transition:transform .5s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;}
.card-face[aria-pressed="true"] .card-inner{transform:rotateY(180deg);}
.face{position:absolute;inset:0;background:var(--card);border:1.5px solid var(--rule);border-radius:var(--radius);box-shadow:0 2px 0 var(--rule),0 10px 24px -12px rgba(35,32,26,.35);padding:2rem 1.75rem;display:flex;flex-direction:column;backface-visibility:hidden;-webkit-backface-visibility:hidden;}
.face::before{content:"";position:absolute;left:1.75rem;right:1.75rem;top:3.2rem;height:2px;background:repeating-linear-gradient(to right,var(--rule) 0 10px,transparent 10px 16px);}
.face .tag{font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--accent-tab);padding:.25em .6em;border-radius:3px 3px 3px 0;}
.face-badges{display:flex;align-items:center;gap:.5rem;align-self:flex-start;margin-bottom:1.4rem;}
.verified-stamp-wrap{position:absolute;right:1.1rem;bottom:1.1rem;transform:rotate(-9deg);pointer-events:none;}
.verified-stamp-ring{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem;width:76px;height:76px;border-radius:50%;border:2px solid var(--accent);box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 5px var(--accent);color:var(--accent);opacity:.88;}
.verified-stamp-ring svg{flex:none;}
.verified-stamp-text{font-family:'Public Sans',sans-serif;font-weight:800;font-size:.5rem;line-height:1.2;letter-spacing:.06em;text-align:center;text-transform:uppercase;}
.face.back .tag{background:var(--accent-dark);}
.face .content{font-family:'Public Sans',system-ui,sans-serif;font-weight:500;font-size:1.3rem;line-height:1.45;flex:1;display:flex;align-items:center;overflow-wrap:anywhere;}
.face .idx{position:absolute;top:.9rem;right:1rem;font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:var(--ink-soft);}
.face.back{transform:rotateY(180deg);}
.controls{display:flex;justify-content:center;align-items:center;gap:.6rem;flex-wrap:wrap;}
.btn{font-family:'Public Sans',sans-serif;font-weight:600;font-size:.95rem;border-radius:8px;border:1.5px solid var(--accent-dark);background:var(--accent);color:#fff;padding:.7em 1.3em;min-height:44px;cursor:pointer;}
.btn:hover{background:var(--accent-dark);}
.btn.secondary{background:var(--card);color:var(--accent-dark);}
.btn.secondary:hover{background:var(--paper-alt);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.hint{color:var(--ink-soft);font-size:.9rem;text-align:center;}
#sr-status{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
@media (prefers-reduced-motion: reduce){.card-inner{transition:none;}}
@media (max-width:500px){.face .content{font-size:1.2rem;}}
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<header class="top">
<span class="eyebrow">Catalog Drawer</span>
<h1>flashcards</h1>
</header>
<main id="main">
<div class="deck-meta"><span class="mono" id="progress"></span></div>
<div class="stage">
<button type="button" class="card-face" id="card-btn" aria-pressed="false">
<span class="card-inner" id="card-inner">
<span class="face front"><span class="idx mono" id="idx-front"></span><span class="face-badges"><span class="tag">Question</span></span><span class="content" id="front-text"></span></span>
<span class="face back" aria-hidden="true"><span class="idx mono" id="idx-back"></span><span class="face-badges"><span class="tag">Answer</span></span><span class="content" id="back-text"></span><span class="verified-stamp-wrap" aria-hidden="true"><span class="verified-stamp-ring"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="verified-stamp-text">Verified<br>Correct</span></span></span></span>
</span>
</button>
</div>
<div class="controls">
<button type="button" class="btn secondary" id="prev-btn">← Previous</button>
<button type="button" class="btn" id="flip-btn">Flip card</button>
<button type="button" class="btn secondary" id="next-btn">Next →</button>
<button type="button" class="btn secondary" id="shuffle-btn">Shuffle</button>
</div>
<p class="hint">Press <kbd>Space</kbd> or <kbd>Enter</kbd> on the focused card to flip it, and use the ←/→ arrow keys to move between cards.</p>
<div id="sr-status" aria-live="polite"></div>
</main>
<script>
(function(){
"use strict";
var cards = [{"front":"How does the BSI guide define a 'Standard'?","back":"An agreed, repeatable way of doing something, published as a technical specification or precise criteria."},{"front":"True or False: Standards are mandatory regulations imposed by the government.","back":"False; Standards are voluntary documents that can be used to support legislation but are not regulatory."},{"front":"What is the primary role of the British Standards Institution (BSI) regarding UK standards?","back":"It acts as the National Standards Body (NSB) for the UK."},{"front":"Which historical UK standard series served as the basis for the international ISO 9001 standard?","back":"The BS 5750 series, first published in 1979."},{"front":"What three tasks must a new committee member complete at the start of their role?","back":"Register for eCommittees, read BS 0, and complete BSI induction eLearning modules."},{"front":"In a BSI committee, what does a 'nominating organization' represent?","back":"A group of stakeholders, such as a trade association, professional institution, or consumer organization."},{"front":"What is the role of an 'individual capacity' or co-opted committee member?","back":"Contributing personal expertise rather than representing a specific stakeholder group."},{"front":"How is 'consensus' defined in the context of standards development?","back":"The general acceptance of a standard achieved by balancing all interests and making reasonable compromises."},{"front":"In consensus building, how are 'trivial or vexatious' objections handled?","back":"They are unlikely to gain support and may be over-ruled by the committee."},{"front":"What happens if a committee member consistently maintains a fundamental objection supported by sound arguments?","back":"Their concerns will be taken seriously and tested within the context of a committee meeting."},{"front":"What do the acronyms CD and DC represent in standards documentation?","back":"Committee Drafts and Drafts for Comment."},{"front":"At what stage is a draft document usually first made available for public comment?","back":"The Draft for Public Comment (DPC) stage."},{"front":"What is the final voting stage for an ISO standard before publication?","back":"The Final Draft International Standard (FDIS) stage."},{"front":"On the BSI commenting form, what information belongs in Column 1 (National committee)?","back":"The initials of the member or the name of their nominating organization."},{"front":"What defines a 'Technical' comment on a draft standard?","back":"A comment specifically addressing the technical content of the document."},{"front":"What defines an 'Editorial' comment on a draft standard?","back":"Corrections to spelling, grammar, or rewording to express technical points more clearly."},{"front":"Why is it critical not to alter column widths or merge cells in the BSI commenting template?","back":"Changes interfere with the electronic collation process and may lead to comments being rejected."},{"front":"Who is responsible for filling in the 'Observations of the secretariat' column in a commenting form?","back":"The international Committee Secretary (not the committee member)."},{"front":"Who retains the copyright on all work accepted for inclusion in a standard?","back":"The British Standards Institution (BSI)."},{"front":"What must a member do before submitting a drawing from their company's internal manual for use in a standard?","back":"Ensure the company agrees to the intellectual property rights (IPR) being released to BSI."},{"front":"What is a committee member's duty if they are aware of a patent applying to a standard under development?","back":"They must bring the patent to the attention of the Committee Secretary or raise it in a meeting."},{"front":"For how long after publication can committee members download a complimentary copy of a standard?","back":"Two months."},{"front":"In international meetings, what is the primary responsibility of a 'Delegate'?","back":"To represent BSI and present the agreed UK national position arrived at by consensus."},{"front":"How does the role of an 'Expert' in an international working group differ from a 'Delegate'?","back":"Experts are nominated for their personal expertise and contribute based on their own knowledge."},{"front":"From where does a UK delegation receive its 'brief' and voting instructions for an international meeting?","back":"From the UK committee responsible for following that international work."},{"front":"What should a delegate's report concentrate on after an international meeting?","back":"Major discussion points, significant decisions, and items of particular interest to the UK."},{"front":"Who can submit a proposal for new work for a UK-origin standard?","back":"Anyone, including committee members, trade associations, or members of the public."},{"front":"In the UK development process, who is assigned to a project once it is accepted by the BSI acceptance team?","back":"A content developer."},{"front":"What is the typical duration for the public consultation period of a draft standard?","back":"Two months."},{"front":"In the UK, what is required before a standard can be signed off for final publication?","back":"Consensus must be achieved by the relevant parent committee."},{"front":"How often are British Standards reviewed to ensure they remain current and accurate?","back":"Every five years."},{"front":"What happens to conflicting national standards when a European Standard (EN) is adopted as a British Standard?","back":"The conflicting national standards must be withdrawn."},{"front":"What BSI system allows the general public to view and comment on all new or revised standards?","back":"The Draft Review System."},{"front":"According to the 2011 BSI survey, what percentage of organizations saw improved legislative compliance via ISO 14001?","back":"$78\\%$."},{"front":"Term: AMD","back":"Definition: Amendment; a ratified supplementary document that alters or adds to a standard's technical provisions."},{"front":"Term: COR","back":"Definition: Corrigendum; a document correcting errors or ambiguities introduced during drafting or printing."},{"front":"In European standardization, what is the purpose of 'Annex Z'?","back":"To show the relationship between a standard and the essential requirements of New Approach Directives."},{"front":"What is the 'Bureau Technique' (BT) in the context of CEN/CENELEC?","back":"The technical board established to oversee the work programme of the organization."},{"front":"What is a 'Harmonized Standard'?","back":"A technical specification adopted by European Standards organizations to support EU New Approach Directives."},{"front":"What does 'P-member' stand for in ISO committee terminology?","back":"Participating member (a voting member)."},{"front":"What is the 'Enquiry' (ENQ) stage in the development of a European Standard?","back":"The stage where a draft (prEN) is made public for comment and attracts a formal vote."},{"front":"Why might a draft standard be sent for a second public consultation period?","back":"If there are significant technical changes made to the draft after the first consultation."},{"front":"What is the function of the 'National Annex' in an adopted international standard?","back":"To provide additional information that supports the use of the adopted standard within the UK."},{"front":"Where do national committee meetings usually take place in the UK?","back":"At the BSI offices in London."},{"front":"Who leads committee meetings and ensures a record of the meeting is kept?","back":"A nominated Chairman."},{"front":"What is the typical publication goal for new or revised British Standards?","back":"12 to 15 months."},{"front":"Term: prEN","back":"Definition: A draft European Standard at the Enquiry (ENQ) stage."},{"front":"What is the 'CEN Workshop Agreement' (CWA)?","back":"An agreement reflecting the limited consensus of identified individuals/organizations, developed by a workshop."},{"front":"What document provides the 'guiding principles' for standards development that all members must follow?","back":"BS 0."},{"front":"What is the purpose of 'Harmonized stage codes'?","back":"To enable unambiguous project data interchange among national, regional, and international standards bodies."}];
var order = cards.map(function(_, i){ return i; });
var current = 0;
var cardBtn = document.getElementById("card-btn");
var frontText = document.getElementById("front-text");
var backText = document.getElementById("back-text");
var idxFront = document.getElementById("idx-front");
var idxBack = document.getElementById("idx-back");
var progressEl = document.getElementById("progress");
var prevBtn = document.getElementById("prev-btn");
var nextBtn = document.getElementById("next-btn");
var flipBtn = document.getElementById("flip-btn");
var shuffleBtn = document.getElementById("shuffle-btn");
var srStatus = document.getElementById("sr-status");
function shuffleArray(arr){ var a = arr.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function renderCard(announce){
  var c = cards[order[current]];
  frontText.textContent = c.front;
  backText.textContent = c.back;
  idxFront.textContent = String(current + 1).padStart(3, "0");
  idxBack.textContent = String(current + 1).padStart(3, "0");
  cardBtn.setAttribute("aria-pressed", "false");
  cardBtn.setAttribute("aria-label", "Question: " + c.front + ". Activate to show the answer.");
  progressEl.textContent = "Card " + (current + 1) + " of " + cards.length;
  if (announce) srStatus.textContent = "Card " + (current + 1) + " of " + cards.length + ". Question: " + c.front;
  prevBtn.disabled = cards.length <= 1;
  nextBtn.disabled = cards.length <= 1;
}
function flipCard(){
  var pressed = cardBtn.getAttribute("aria-pressed") === "true";
  var c = cards[order[current]];
  if (pressed){
    cardBtn.setAttribute("aria-pressed", "false");
    cardBtn.setAttribute("aria-label", "Question: " + c.front + ". Activate to show the answer.");
    srStatus.textContent = "Showing question: " + c.front;
  } else {
    cardBtn.setAttribute("aria-pressed", "true");
    cardBtn.setAttribute("aria-label", "Verified answer: " + c.back + ". Activate to show the question.");
    srStatus.textContent = "Showing verified answer: " + c.back;
  }
}
function goTo(delta){
  if (cards.length < 2) return;
  current = (current + delta + cards.length) % cards.length;
  renderCard(true);
}
cardBtn.addEventListener("click", flipCard);
flipBtn.addEventListener("click", function(){ cardBtn.focus(); flipCard(); });
prevBtn.addEventListener("click", function(){ goTo(-1); });
nextBtn.addEventListener("click", function(){ goTo(1); });
shuffleBtn.addEventListener("click", function(){ order = shuffleArray(order); current = 0; renderCard(false); srStatus.textContent = "Deck shuffled. Card 1 of " + cards.length; });
document.addEventListener("keydown", function(e){
  if (e.key === "ArrowLeft"){ e.preventDefault(); goTo(-1); }
  else if (e.key === "ArrowRight"){ e.preventDefault(); goTo(1); }
});
if (cards.length){ renderCard(true); } else { progressEl.textContent = "No cards found."; }
})();
</script>
</body>
</html>
