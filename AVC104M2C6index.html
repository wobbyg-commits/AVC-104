<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>flashcards — Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#F3F0E7;--paper-alt:#ECE6D6;--card:#FFFFFF;--ink:#23201A;--ink-soft:#5B564A;--accent:#145A4A;--accent-dark:#0E463A;--accent-tab:#8B3A2F;--rule:#D9D2C1;--focus:#0E463A;--radius:10px;font-size:16px;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--paper);color:var(--ink);font-family:'Public Sans',system-ui,sans-serif;line-height:1.5;min-height:100vh;}
h1{font-family:'Public Sans',system-ui,sans-serif;font-weight:800;letter-spacing:-.01em;margin:0 0 .3em;}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.02em;}
.skip-link{position:absolute;left:-999px;top:0;background:var(--accent-dark);color:#fff;padding:.75em 1.25em;z-index:100;border-radius:0 0 8px 0;font-weight:600;}
.skip-link:focus{left:0;}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;}
header.top{border-bottom:2px solid var(--ink);padding:1.75rem 1.5rem 1.25rem;max-width:700px;margin:0 auto;}
header.top .eyebrow{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-dark);background:var(--paper-alt);border:1px solid var(--rule);padding:.2em .6em;border-radius:4px;margin-bottom:.6rem;}
main{max-width:700px;margin:0 auto;padding:1.5rem;}
.deck-meta{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.6rem;margin-bottom:1rem;}
.stage{perspective:1400px;max-width:560px;margin:0 auto 1.25rem;}
.card-face{position:relative;width:100%;min-height:260px;border-radius:var(--radius);background:transparent;border:none;padding:0;cursor:pointer;display:block;}
.card-inner{display:block;position:relative;width:100%;height:100%;min-height:260px;transition:transform .5s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;}
.card-face[aria-pressed="true"] .card-inner{transform:rotateY(180deg);}
.face{position:absolute;inset:0;background:var(--card);border:1.5px solid var(--rule);border-radius:var(--radius);box-shadow:0 2px 0 var(--rule),0 10px 24px -12px rgba(35,32,26,.35);padding:2rem 1.75rem;display:flex;flex-direction:column;backface-visibility:hidden;-webkit-backface-visibility:hidden;}
.face::before{content:"";position:absolute;left:1.75rem;right:1.75rem;top:3.2rem;height:2px;background:repeating-linear-gradient(to right,var(--rule) 0 10px,transparent 10px 16px);}
.face .tag{font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--accent-tab);padding:.25em .6em;border-radius:3px 3px 3px 0;}
.face-badges{display:flex;align-items:center;gap:.5rem;align-self:flex-start;margin-bottom:1.4rem;}
.verified-stamp-wrap{position:absolute;right:1.1rem;bottom:1.1rem;transform:rotate(-9deg);pointer-events:none;}
.verified-stamp-ring{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem;width:76px;height:76px;border-radius:50%;border:2px solid var(--accent);box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 5px var(--accent);color:var(--accent);opacity:.88;}
.verified-stamp-ring svg{flex:none;}
.verified-stamp-text{font-family:'Public Sans',sans-serif;font-weight:800;font-size:.5rem;line-height:1.2;letter-spacing:.06em;text-align:center;text-transform:uppercase;}
.face.back .tag{background:var(--accent-dark);}
.face .content{font-family:'Public Sans',system-ui,sans-serif;font-weight:500;font-size:1.3rem;line-height:1.45;flex:1;display:flex;align-items:center;overflow-wrap:anywhere;}
.face .idx{position:absolute;top:.9rem;right:1rem;font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:var(--ink-soft);}
.face.back{transform:rotateY(180deg);}
.controls{display:flex;justify-content:center;align-items:center;gap:.6rem;flex-wrap:wrap;}
.btn{font-family:'Public Sans',sans-serif;font-weight:600;font-size:.95rem;border-radius:8px;border:1.5px solid var(--accent-dark);background:var(--accent);color:#fff;padding:.7em 1.3em;min-height:44px;cursor:pointer;}
.btn:hover{background:var(--accent-dark);}
.btn.secondary{background:var(--card);color:var(--accent-dark);}
.btn.secondary:hover{background:var(--paper-alt);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.hint{color:var(--ink-soft);font-size:.9rem;text-align:center;}
#sr-status{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
@media (prefers-reduced-motion: reduce){.card-inner{transition:none;}}
@media (max-width:500px){.face .content{font-size:1.2rem;}}
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<header class="top">
<span class="eyebrow">Catalog Drawer</span>
<h1>flashcards</h1>
</header>
<main id="main">
<div class="deck-meta"><span class="mono" id="progress"></span></div>
<div class="stage">
<button type="button" class="card-face" id="card-btn" aria-pressed="false">
<span class="card-inner" id="card-inner">
<span class="face front"><span class="idx mono" id="idx-front"></span><span class="face-badges"><span class="tag">Question</span></span><span class="content" id="front-text"></span></span>
<span class="face back" aria-hidden="true"><span class="idx mono" id="idx-back"></span><span class="face-badges"><span class="tag">Answer</span></span><span class="content" id="back-text"></span><span class="verified-stamp-wrap" aria-hidden="true"><span class="verified-stamp-ring"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="verified-stamp-text">Verified<br>Correct</span></span></span></span>
</span>
</button>
</div>
<div class="controls">
<button type="button" class="btn secondary" id="prev-btn">← Previous</button>
<button type="button" class="btn" id="flip-btn">Flip card</button>
<button type="button" class="btn secondary" id="next-btn">Next →</button>
<button type="button" class="btn secondary" id="shuffle-btn">Shuffle</button>
</div>
<p class="hint">Press <kbd>Space</kbd> or <kbd>Enter</kbd> on the focused card to flip it, and use the ←/→ arrow keys to move between cards.</p>
<div id="sr-status" aria-live="polite"></div>
</main>
<script>
(function(){
"use strict";
var cards = [{"front":"What is the primary focus of Total Quality Management (TQM)?","back":"Long-term success achieved through customer satisfaction."},{"front":"In the context of QA/QC, which process is 'process oriented' and focuses on defect prevention?","back":"Quality assurance (QA)."},{"front":"In the context of QA/QC, which process is 'product oriented' and focuses on defect identification?","back":"Quality control (QC)."},{"front":"According to TQM principles, who ultimately determines the level of quality?","back":"The customer."},{"front":"TQM Principle: Total employee involvement requires that _____ be driven from the workplace to gain commitment.","back":"fear"},{"front":"In TQM, what is defined as a series of steps that take inputs from suppliers and transforms them into outputs for customers?","back":"A process."},{"front":"What integrated system model, established by the US government in 1988, is often used to implement TQM?","back":"The Malcolm Baldrige National Quality Award (MBNQA) criteria."},{"front":"Which quality pioneer is considered a founder of TQM and helped the US Census Bureau with sampling techniques?","back":"W. Edwards Deming."},{"front":"Which quality expert is credited with adding the 'human dimension' to quality management and emphasizing management education?","back":"Joseph M. Juran."},{"front":"What quality concept did Philip B. Crosby promote to pave the way for company-wide quality improvement?","back":"Zero defects."},{"front":"Who wrote the book 'Total Quality Control', which served as a forerunner for modern TQM understanding?","back":"Armand V. Feigenbaum."},{"front":"According to Deming's 14 points, organizations should cease dependence on _____ to achieve quality.","back":"inspection"},{"front":"Deming's Point 4 suggests minimizing total cost by working with a _____ for any one item.","back":"single supplier"},{"front":"What TQM implementation strategy involves visiting leading organizations to determine their reasons for success and adapting their processes?","back":"The organization model approach."},{"front":"Term: MIL-STD-105E","back":"Definition: A United States Military Standard that provides sampling procedures and tables for inspection by attributes."},{"front":"In MIL-STD-105E, what does 'Inspection by Attributes' mean?","back":"Inspection where units are classified as defective/non-defective or the number of defects is counted."},{"front":"Formula: Percent Defective","back":"$\\frac{\\text{Number of defectives}}{\\text{Number of units inspected}} \\times 100$"},{"front":"Term: Acceptable Quality Level (AQL)","back":"Definition: The maximum percent defective (or defects per hundred units) that can be considered satisfactory as a process average."},{"front":"How is a 'Critical Defect' defined in MIL-STD-105E?","back":"A defect that is likely to result in hazardous or unsafe conditions for individuals using or maintaining the product."},{"front":"How is a 'Major Defect' defined in MIL-STD-105E?","back":"A non-critical defect likely to result in failure or materially reduce the usability of the unit for its intended purpose."},{"front":"How is a 'Minor Defect' defined in MIL-STD-105E?","back":"A defect that is not likely to reduce materially the usability of the unit for its intended purpose."},{"front":"In MIL-STD-105E, what is an 'Inspection Lot'?","back":"A collection of units of product from which a sample is to be drawn and inspected."},{"front":"What does the 'Sample Size Code Letter' represent in MIL-STD-105E?","back":"A device used with the AQL to locate a sampling plan in the provided tables."},{"front":"Under MIL-STD-105E, what happens when 2 out of 5 consecutive lots are rejected on original inspection?","back":"The switching rule requires a move from Normal to Tightened inspection."},{"front":"Under MIL-STD-105E, how many consecutive lots must be accepted on original inspection to switch from Tightened to Normal?","back":"Five (5) consecutive lots."},{"front":"Which MIL-STD-105E switching rule requires that the preceding 10 lots have been accepted on normal inspection and total defects are within a specific limit?","back":"Normal to Reduced inspection."},{"front":"Under what condition must inspection be discontinued under MIL-STD-105E?","back":"When the cumulative number of lots not accepted on tightened inspection reaches five (5) in a sequence."},{"front":"MIL-STD-105E identifies three 'General Inspection Levels'. Which level is considered the standard or 'Normal' level?","back":"Level II."},{"front":"In attribute sampling, what is a 'Single Sampling Plan'?","back":"A plan where the results of a single sample determine the acceptance or rejection of a lot."},{"front":"In a MIL-STD-105E 'Double Sampling Plan', what happens if the number of defectives in the first sample is between the first acceptance and rejection numbers?","back":"A second sample must be inspected and the results accumulated with the first."},{"front":"What is the primary goal of using a 'Limiting Quality' (LQ) sampling plan?","back":"To protect the consumer by limiting the proportion of defectives in an isolated lot."},{"front":"What is the purpose of 'Operating Characteristic (OC) Curves' in MIL-STD-105E?","back":"To show the percentage of lots expected to be accepted under various sampling plans for a given process quality."},{"front":"What term is used in TQM history to describe the 1920s experiments showing that worker productivity is impacted by participation in management?","back":"The Hawthorne experiments."},{"front":"Who developed the initial methods for statistical analysis and control of quality in the 1930s that informed the work of Deming and Juran?","back":"Walter Shewhart."},{"front":"Kaoru Ishikawa is known for synthesizing quality philosophy and contributing to the ascendancy of which country as a quality leader?","back":"Japan."},{"front":"What is 'Hoshin Planning' in the context of TQM implementation?","back":"A method used by managers to contribute individually to the organizational quality effort."},{"front":"One criticism of TQM is that focusing exclusively on customer satisfaction might hinder _____.","back":"creativity and innovation"},{"front":"Which certification is intended for professionals who lead and champion process-improvement initiatives based on quality management?","back":"Certified Manager of Quality/Organizational Excellence (CMQ/OE)."},{"front":"In MIL-STD-105E, the term 'Lot or Batch Size' refers to the total number of _____ in a lot or batch.","back":"units of product"},{"front":"What are the four 'Special Inspection Levels' (S-1 to S-4) in MIL-STD-105E used for?","back":"Situations where relatively small sample sizes are necessary and large sampling risks can be tolerated."},{"front":"Concept: Representative Sampling","back":"Definition: Selecting sample units in proportion to the size of sublots or sub-batches within a larger lot."},{"front":"What is the 'Process Average' in attribute sampling?","back":"The average percent defective of product submitted by a supplier for original inspection."},{"front":"Under MIL-STD-105E, if a lot is rejected during 'Reduced' inspection, the inspector must immediately revert to _____ inspection.","back":"Normal"},{"front":"TQM Principle: Integrated System refers to focusing on _____ processes that interconnect various functional specialties.","back":"horizontal"},{"front":"What is the core benefit of 'Fact-based decision-making' in TQM?","back":"Improving decision accuracy and projecting future outcomes based on performance data."},{"front":"Deming's Point 12 emphasizes removing barriers that rob people of _____.","back":"pride of workmanship"},{"front":"In MIL-STD-105E, what happens if the cumulative number of defects in a double sample is equal to or less than the second acceptance number?","back":"The lot or batch is considered acceptable."},{"front":"According to the TQM background, the name 'Total Quality Management' was initially coined by which organization?","back":"The Naval Air Systems Command."},{"front":"Juran's 'Quality Control Handbook' was first published in which year?","back":"1951."},{"front":"What is the main purpose of the 'Control' phase in the DMAIC process (alluded to in ASQ materials)?","back":"To sustain the improvements made during the process."},{"front":"TQM Strategy: The 'Guru Approach' uses the teachings of leading quality thinkers as a _____ to identify organizational deficiencies.","back":"guide"},{"front":"Why is TQM often called 'Business Excellence' in modern contexts?","back":"To distinguish current systemic approaches from past iterations of TQM."},{"front":"In MIL-STD-105E, the AQL is the limit of a satisfactory _____.","back":"process average"},{"front":"Which document is noted as superseding MIL-STD-105D?","back":"MIL-STD-105E."},{"front":"Under MIL-STD-105E, 'Original Inspection' refers to the _____ inspection of a particular quantity of product.","back":"first"}];
var order = cards.map(function(_, i){ return i; });
var current = 0;
var cardBtn = document.getElementById("card-btn");
var frontText = document.getElementById("front-text");
var backText = document.getElementById("back-text");
var idxFront = document.getElementById("idx-front");
var idxBack = document.getElementById("idx-back");
var progressEl = document.getElementById("progress");
var prevBtn = document.getElementById("prev-btn");
var nextBtn = document.getElementById("next-btn");
var flipBtn = document.getElementById("flip-btn");
var shuffleBtn = document.getElementById("shuffle-btn");
var srStatus = document.getElementById("sr-status");
function shuffleArray(arr){ var a = arr.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function renderCard(announce){
  var c = cards[order[current]];
  frontText.textContent = c.front;
  backText.textContent = c.back;
  idxFront.textContent = String(current + 1).padStart(3, "0");
  idxBack.textContent = String(current + 1).padStart(3, "0");
  cardBtn.setAttribute("aria-pressed", "false");
  cardBtn.setAttribute("aria-label", "Question: " + c.front + ". Activate to show the answer.");
  progressEl.textContent = "Card " + (current + 1) + " of " + cards.length;
  if (announce) srStatus.textContent = "Card " + (current + 1) + " of " + cards.length + ". Question: " + c.front;
  prevBtn.disabled = cards.length <= 1;
  nextBtn.disabled = cards.length <= 1;
}
function flipCard(){
  var pressed = cardBtn.getAttribute("aria-pressed") === "true";
  var c = cards[order[current]];
  if (pressed){
    cardBtn.setAttribute("aria-pressed", "false");
    cardBtn.setAttribute("aria-label", "Question: " + c.front + ". Activate to show the answer.");
    srStatus.textContent = "Showing question: " + c.front;
  } else {
    cardBtn.setAttribute("aria-pressed", "true");
    cardBtn.setAttribute("aria-label", "Verified answer: " + c.back + ". Activate to show the question.");
    srStatus.textContent = "Showing verified answer: " + c.back;
  }
}
function goTo(delta){
  if (cards.length < 2) return;
  current = (current + delta + cards.length) % cards.length;
  renderCard(true);
}
cardBtn.addEventListener("click", flipCard);
flipBtn.addEventListener("click", function(){ cardBtn.focus(); flipCard(); });
prevBtn.addEventListener("click", function(){ goTo(-1); });
nextBtn.addEventListener("click", function(){ goTo(1); });
shuffleBtn.addEventListener("click", function(){ order = shuffleArray(order); current = 0; renderCard(false); srStatus.textContent = "Deck shuffled. Card 1 of " + cards.length; });
document.addEventListener("keydown", function(e){
  if (e.key === "ArrowLeft"){ e.preventDefault(); goTo(-1); }
  else if (e.key === "ArrowRight"){ e.preventDefault(); goTo(1); }
});
if (cards.length){ renderCard(true); } else { progressEl.textContent = "No cards found."; }
})();
</script>
</body>
</html>
