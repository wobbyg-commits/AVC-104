<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>flashcards — Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#F3F0E7;--paper-alt:#ECE6D6;--card:#FFFFFF;--ink:#23201A;--ink-soft:#5B564A;--accent:#145A4A;--accent-dark:#0E463A;--accent-tab:#8B3A2F;--rule:#D9D2C1;--focus:#0E463A;--radius:10px;font-size:16px;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--paper);color:var(--ink);font-family:'Public Sans',system-ui,sans-serif;line-height:1.5;min-height:100vh;}
h1{font-family:'Public Sans',system-ui,sans-serif;font-weight:800;letter-spacing:-.01em;margin:0 0 .3em;}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.02em;}
.skip-link{position:absolute;left:-999px;top:0;background:var(--accent-dark);color:#fff;padding:.75em 1.25em;z-index:100;border-radius:0 0 8px 0;font-weight:600;}
.skip-link:focus{left:0;}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;}
header.top{border-bottom:2px solid var(--ink);padding:1.75rem 1.5rem 1.25rem;max-width:700px;margin:0 auto;}
header.top .eyebrow{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-dark);background:var(--paper-alt);border:1px solid var(--rule);padding:.2em .6em;border-radius:4px;margin-bottom:.6rem;}
main{max-width:700px;margin:0 auto;padding:1.5rem;}
.deck-meta{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.6rem;margin-bottom:1rem;}
.stage{perspective:1400px;max-width:560px;margin:0 auto 1.25rem;}
.card-face{position:relative;width:100%;min-height:260px;border-radius:var(--radius);background:transparent;border:none;padding:0;cursor:pointer;display:block;}
.card-inner{display:block;position:relative;width:100%;height:100%;min-height:260px;transition:transform .5s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;}
.card-face[aria-pressed="true"] .card-inner{transform:rotateY(180deg);}
.face{position:absolute;inset:0;background:var(--card);border:1.5px solid var(--rule);border-radius:var(--radius);box-shadow:0 2px 0 var(--rule),0 10px 24px -12px rgba(35,32,26,.35);padding:2rem 1.75rem;display:flex;flex-direction:column;backface-visibility:hidden;-webkit-backface-visibility:hidden;}
.face::before{content:"";position:absolute;left:1.75rem;right:1.75rem;top:3.2rem;height:2px;background:repeating-linear-gradient(to right,var(--rule) 0 10px,transparent 10px 16px);}
.face .tag{font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--accent-tab);padding:.25em .6em;border-radius:3px 3px 3px 0;}
.face-badges{display:flex;align-items:center;gap:.5rem;align-self:flex-start;margin-bottom:1.4rem;}
.verified-stamp-wrap{position:absolute;right:1.1rem;bottom:1.1rem;transform:rotate(-9deg);pointer-events:none;}
.verified-stamp-ring{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem;width:76px;height:76px;border-radius:50%;border:2px solid var(--accent);box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 5px var(--accent);color:var(--accent);opacity:.88;}
.verified-stamp-ring svg{flex:none;}
.verified-stamp-text{font-family:'Public Sans',sans-serif;font-weight:800;font-size:.5rem;line-height:1.2;letter-spacing:.06em;text-align:center;text-transform:uppercase;}
.face.back .tag{background:var(--accent-dark);}
.face .content{font-family:'Public Sans',system-ui,sans-serif;font-weight:500;font-size:1.3rem;line-height:1.45;flex:1;display:flex;align-items:center;overflow-wrap:anywhere;}
.face .idx{position:absolute;top:.9rem;right:1rem;font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:var(--ink-soft);}
.face.back{transform:rotateY(180deg);}
.controls{display:flex;justify-content:center;align-items:center;gap:.6rem;flex-wrap:wrap;}
.btn{font-family:'Public Sans',sans-serif;font-weight:600;font-size:.95rem;border-radius:8px;border:1.5px solid var(--accent-dark);background:var(--accent);color:#fff;padding:.7em 1.3em;min-height:44px;cursor:pointer;}
.btn:hover{background:var(--accent-dark);}
.btn.secondary{background:var(--card);color:var(--accent-dark);}
.btn.secondary:hover{background:var(--paper-alt);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.hint{color:var(--ink-soft);font-size:.9rem;text-align:center;}
#sr-status{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
@media (prefers-reduced-motion: reduce){.card-inner{transition:none;}}
@media (max-width:500px){.face .content{font-size:1.2rem;}}
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<header class="top">
<span class="eyebrow">Catalog Drawer</span>
<h1>flashcards</h1>
</header>
<main id="main">
<div class="deck-meta"><span class="mono" id="progress"></span></div>
<div class="stage">
<button type="button" class="card-face" id="card-btn" aria-pressed="false">
<span class="card-inner" id="card-inner">
<span class="face front"><span class="idx mono" id="idx-front"></span><span class="face-badges"><span class="tag">Question</span></span><span class="content" id="front-text"></span></span>
<span class="face back" aria-hidden="true"><span class="idx mono" id="idx-back"></span><span class="face-badges"><span class="tag">Answer</span></span><span class="content" id="back-text"></span><span class="verified-stamp-wrap" aria-hidden="true"><span class="verified-stamp-ring"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="verified-stamp-text">Verified<br>Correct</span></span></span></span>
</span>
</button>
</div>
<div class="controls">
<button type="button" class="btn secondary" id="prev-btn">← Previous</button>
<button type="button" class="btn" id="flip-btn">Flip card</button>
<button type="button" class="btn secondary" id="next-btn">Next →</button>
<button type="button" class="btn secondary" id="shuffle-btn">Shuffle</button>
</div>
<p class="hint">Press <kbd>Space</kbd> or <kbd>Enter</kbd> on the focused card to flip it, and use the ←/→ arrow keys to move between cards.</p>
<div id="sr-status" aria-live="polite"></div>
</main>
<script>
(function(){
"use strict";
var cards = [{"front":"How is 'quality' defined in its simplest terms?","back":"Meeting or exceeding the expectations of the customer."},{"front":"In aircraft assembly, what does it mean for a product to do what it is supposed to do reliably and safely?","back":"The product possesses quality."},{"front":"Why is quality considered critical in aerospace assembly beyond just following rules?","back":"Because lives depend on every rivet and system performing exactly as designed."},{"front":"What is the common misconception regarding when quality is 'achieved' in a process?","back":"That it is just about catching defects at the end of a process."},{"front":"Where must quality be 'built in' during the manufacturing lifecycle?","back":"At every step of manufacturing."},{"front":"List three specific, measurable actions that demonstrate quality in aircraft assembly practice.","back":"Conforming to drawings, meeting material specs, and passing functional tests."},{"front":"Term: External Customer","back":"Definition: The airlines, military branches, or private operators who purchase and operate the aircraft."},{"front":"Term: Internal Customer","back":"Definition: The next person or department in the assembly process who receives your work."},{"front":"In a quality system, what defines what 'good enough' actually looks like?","back":"Expectations."},{"front":"What documents provide the drawings, tolerances, and material callouts used in assembly?","back":"Engineering specifications."},{"front":"Which standard is the aerospace-specific extension of ISO 9001?","back":"AS9100."},{"front":"What type of expectations are clearly stated in drawings, work orders, or purchase agreements?","back":"Explicit expectations."},{"front":"A customer's unspoken assumption that an aircraft is structurally sound is an example of an _____ expectation.","back":"implicit"},{"front":"Term: Quality Management System (QMS)","back":"Definition: A formalized set of policies, processes, procedures, and records used to ensure products meet requirements."},{"front":"What organization must approve the QMS of a certified aerospace manufacturer?","back":"The Federal Aviation Administration (FAA)."},{"front":"Which QMS element involves ensuring only current, approved revisions of drawings are in use?","back":"Document control."},{"front":"What is the purpose of 'Process Control' within a QMS?","back":"Standardizing work to reduce variation and prevent defects."},{"front":"Which QMS process involves identifying the root causes of problems to prevent their recurrence?","back":"Corrective action."},{"front":"Who introduced 'Scientific Management' in the early 1900s, separating planning from execution?","back":"Frederick Winslow Taylor."},{"front":"Who developed Statistical Process Control (SPC) and the PDCA cycle at Bell Labs in the 1920s?","back":"Walter Shewhart."},{"front":"Which two American quality experts transformed Japanese manufacturing after World War II?","back":"W. Edwards Deming and Joseph Juran."},{"front":"How did W. Edwards Deming define the cause of $85\\%$ of quality problems?","back":"They are caused by systems, not workers."},{"front":"Who defined quality as 'fitness for use' and introduced the concept of the cost of quality?","back":"Joseph Juran."},{"front":"Which quality pioneer promoted the concept of 'zero defects' and the idea that 'Quality is Free'?","back":"Philip Crosby."},{"front":"In what year was the first ISO 9000 series published?","back":"1987."},{"front":"What is the current version of the aerospace quality management standard used today?","back":"AS9100 Revision D."},{"front":"Term: Total Quality Management (TQM)","back":"Definition: A management approach focusing on continuous improvement through the involvement of all employees."},{"front":"In TQM, who is responsible for quality within the organization?","back":"Every employee at every level."},{"front":"What is the ultimate measure of success according to TQM philosophy?","back":"Customer satisfaction."},{"front":"What is the TQM principle 'Kaizen' also known as?","back":"Continuous improvement."},{"front":"What does TQM suggest leadership should do when problems occur instead of blaming individuals?","back":"Focus on improving the process."},{"front":"What are the four stages of the PDCA cycle?","back":"Plan, Do, Check, and Act."},{"front":"In the PDCA cycle, what is the primary goal of the 'Check' stage?","back":"To measure results."},{"front":"Who is considered the 'first line of quality defense' on the shop floor?","back":"The Assembly Technician."},{"front":"What is the primary responsibility of a Quality Inspector (QA)?","back":"To perform independent verification that work meets requirements."},{"front":"Which role evaluates non-conformances and issues 'dispositions' like rework or scrap?","back":"Engineering."},{"front":"Why is a signature on a work order or inspection record legally significant in aviation?","back":"It is a legal certification that work was performed correctly, and falsifying it is a federal crime."},{"front":"What are the three main types of suppliers in the aerospace quality chain?","back":"Raw material suppliers, component manufacturers, and subassembly shops."},{"front":"How do quality systems lower the 'total cost' for airline customers?","back":"By reducing unscheduled maintenance events and associated downtime."},{"front":"In the 'Cost of Poor Quality' model, which two categories are considered investments?","back":"Prevention costs and Appraisal costs."},{"front":"Give an example of an 'External Failure Cost' in aerospace manufacturing.","back":"Warranty claims, groundings, or legal liability."},{"front":"How much more does it typically cost to fix a defect found after delivery compared to one caught at the source?","back":"$5-10\\times$ more."},{"front":"What average percentage of rework reduction do companies often report within two years of implementing TQM?","back":"$40\\%$."},{"front":"Term: Quality Escape","back":"Definition: A non-conforming part that passes through the system undetected and enters service."},{"front":"What mandatory FAA directives are often traceable to quality escapes during manufacturing?","back":"Airworthiness Directives (ADs)."},{"front":"What is the recommended assembler habit when an instruction seems unclear or fitment is incorrect?","back":"Stop and ask a supervisor or quality engineer."},{"front":"Why must an assembler always 'Read Before You Do' even if they have performed the task before?","back":"To ensure they are using the current revision of the work instruction or drawing."},{"front":"What is the consequence of 'working around' a discrepancy instead of reporting it immediately?","back":"It prevents the system from improving and allows the problem to grow."},{"front":"In the QMS 'Integrated System' principle, how do departments work together?","back":"They collaborate toward shared quality objectives."},{"front":"Which era of quality history focused on mass production demands and military quality standards?","back":"The WWII Era."},{"front":"What is the primary difference between a QMS and TQM?","back":"A QMS is a formalized framework of rules, while TQM is a broad management philosophy and culture."},{"front":"What is the purpose of a Management Review in a QMS?","back":"To ensure the system is effective and being continually improved."},{"front":"Under the principle of 'Fact-Based Decision Making,' what should drive organizational decisions?","back":"Data, measurements, and analysis."},{"front":"How does 'Document Control' prevent quality errors?","back":"By ensuring technicians do not use outdated or unapproved drawings."},{"front":"What role does a Production Supervisor play in the quality culture?","back":"Ensuring workers feel safe raising quality concerns without fear."},{"front":"Why is 'source inspection' performed at subassembly shops?","back":"To verify quality before parts reach the final assembly line."},{"front":"What is an 'Internal Failure Cost'?","back":"Costs from defects found before the product reaches the customer, such as scrap or rework."},{"front":"According to the 'Quality Mindset,' what should an assembler record on a work order?","back":"What was actually done, accurately and honestly."},{"front":"What does a 'Strategic Approach' to quality involve?","back":"Integrating quality goals into the organization's overall vision and plan."},{"front":"How does TQM improve the workforce?","back":"By empowering employees to contribute to improvement and take ownership of quality."},{"front":"In the context of QMS, what are 'procedures and work instructions' used for?","back":"Providing documented steps to ensure work is done correctly and consistently."},{"front":"What is the benefit of 'Regulatory Confidence' for an airline?","back":"The ability to operate knowing aircraft meet international airworthiness standards."},{"front":"What is the focus of NASA's early aerospace quality specifications from the 1950s?","back":"Meeting the reliability requirements of the space race and military programs."},{"front":"Which TQM principle emphasizes that improvement is never finished?","back":"Continuous Improvement (Kaizen)."},{"front":"In the PDCA cycle, what happens during the 'Do' phase?","back":"A small-scale implementation of the plan is tested."},{"front":"What is the primary goal of the FAA Manufacturing Inspection District Offices (MIDOs)?","back":"Conducting oversight activities for aircraft manufacturing quality systems."},{"front":"What is the 'Cost Multiplier' effect in quality management?","back":"The principle that fixing defects becomes exponentially more expensive the later they are found."},{"front":"How does 'Process-Centered Thinking' change how an organization handles mistakes?","back":"It leads to fixing the underlying process instead of blaming the individual worker."},{"front":"What is an example of an 'Appraisal Cost'?","back":"Inspection, testing, calibration, and audits."},{"front":"What does the TQM principle of 'Total Employee Involvement' require of the CEO?","back":"Active participation in achieving quality goals alongside assembly technicians."},{"front":"In aerospace, what is the weight of an 'Implicit Expectation' compared to an explicit one?","back":"They carry the same weight."},{"front":"What is the 'Engine of TQM'?","back":"The Plan-Do-Check-Act (PDCA) cycle."},{"front":"What is 'disposition' in the context of engineering and non-conformance?","back":"A formal decision on whether to use-as-is, rework, repair, or scrap a part."},{"front":"What is 'verification evidence' in a QMS?","back":"Records and inspection signatures that prove work met requirements."}];
var order = cards.map(function(_, i){ return i; });
var current = 0;
var cardBtn = document.getElementById("card-btn");
var frontText = document.getElementById("front-text");
var backText = document.getElementById("back-text");
var idxFront = document.getElementById("idx-front");
var idxBack = document.getElementById("idx-back");
var progressEl = document.getElementById("progress");
var prevBtn = document.getElementById("prev-btn");
var nextBtn = document.getElementById("next-btn");
var flipBtn = document.getElementById("flip-btn");
var shuffleBtn = document.getElementById("shuffle-btn");
var srStatus = document.getElementById("sr-status");
function shuffleArray(arr){ var a = arr.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function renderCard(announce){
  var c = cards[order[current]];
  frontText.textContent = c.front;
  backText.textContent = c.back;
  idxFront.textContent = String(current + 1).padStart(3, "0");
  idxBack.textContent = String(current + 1).padStart(3, "0");
  cardBtn.setAttribute("aria-pressed", "false");
  cardBtn.setAttribute("aria-label", "Question: " + c.front + ". Activate to show the answer.");
  progressEl.textContent = "Card " + (current + 1) + " of " + cards.length;
  if (announce) srStatus.textContent = "Card " + (current + 1) + " of " + cards.length + ". Question: " + c.front;
  prevBtn.disabled = cards.length <= 1;
  nextBtn.disabled = cards.length <= 1;
}
function flipCard(){
  var pressed = cardBtn.getAttribute("aria-pressed") === "true";
  var c = cards[order[current]];
  if (pressed){
    cardBtn.setAttribute("aria-pressed", "false");
    cardBtn.setAttribute("aria-label", "Question: " + c.front + ". Activate to show the answer.");
    srStatus.textContent = "Showing question: " + c.front;
  } else {
    cardBtn.setAttribute("aria-pressed", "true");
    cardBtn.setAttribute("aria-label", "Verified answer: " + c.back + ". Activate to show the question.");
    srStatus.textContent = "Showing verified answer: " + c.back;
  }
}
function goTo(delta){
  if (cards.length < 2) return;
  current = (current + delta + cards.length) % cards.length;
  renderCard(true);
}
cardBtn.addEventListener("click", flipCard);
flipBtn.addEventListener("click", function(){ cardBtn.focus(); flipCard(); });
prevBtn.addEventListener("click", function(){ goTo(-1); });
nextBtn.addEventListener("click", function(){ goTo(1); });
shuffleBtn.addEventListener("click", function(){ order = shuffleArray(order); current = 0; renderCard(false); srStatus.textContent = "Deck shuffled. Card 1 of " + cards.length; });
document.addEventListener("keydown", function(e){
  if (e.key === "ArrowLeft"){ e.preventDefault(); goTo(-1); }
  else if (e.key === "ArrowRight"){ e.preventDefault(); goTo(1); }
});
if (cards.length){ renderCard(true); } else { progressEl.textContent = "No cards found."; }
})();
</script>
</body>
</html>
