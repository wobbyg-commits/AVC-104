<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>flashcards — Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#F3F0E7;--paper-alt:#ECE6D6;--card:#FFFFFF;--ink:#23201A;--ink-soft:#5B564A;--accent:#145A4A;--accent-dark:#0E463A;--accent-tab:#8B3A2F;--rule:#D9D2C1;--focus:#0E463A;--radius:10px;font-size:16px;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--paper);color:var(--ink);font-family:'Public Sans',system-ui,sans-serif;line-height:1.5;min-height:100vh;}
h1{font-family:'Public Sans',system-ui,sans-serif;font-weight:800;letter-spacing:-.01em;margin:0 0 .3em;}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.02em;}
.skip-link{position:absolute;left:-999px;top:0;background:var(--accent-dark);color:#fff;padding:.75em 1.25em;z-index:100;border-radius:0 0 8px 0;font-weight:600;}
.skip-link:focus{left:0;}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;}
header.top{border-bottom:2px solid var(--ink);padding:1.75rem 1.5rem 1.25rem;max-width:700px;margin:0 auto;}
header.top .eyebrow{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-dark);background:var(--paper-alt);border:1px solid var(--rule);padding:.2em .6em;border-radius:4px;margin-bottom:.6rem;}
main{max-width:700px;margin:0 auto;padding:1.5rem;}
.deck-meta{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.6rem;margin-bottom:1rem;}
.stage{perspective:1400px;max-width:560px;margin:0 auto 1.25rem;}
.card-face{position:relative;width:100%;min-height:260px;border-radius:var(--radius);background:transparent;border:none;padding:0;cursor:pointer;display:block;}
.card-inner{display:block;position:relative;width:100%;height:100%;min-height:260px;transition:transform .5s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;}
.card-face[aria-pressed="true"] .card-inner{transform:rotateY(180deg);}
.face{position:absolute;inset:0;background:var(--card);border:1.5px solid var(--rule);border-radius:var(--radius);box-shadow:0 2px 0 var(--rule),0 10px 24px -12px rgba(35,32,26,.35);padding:2rem 1.75rem;display:flex;flex-direction:column;backface-visibility:hidden;-webkit-backface-visibility:hidden;}
.face::before{content:"";position:absolute;left:1.75rem;right:1.75rem;top:3.2rem;height:2px;background:repeating-linear-gradient(to right,var(--rule) 0 10px,transparent 10px 16px);}
.face .tag{font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--accent-tab);padding:.25em .6em;border-radius:3px 3px 3px 0;}
.face-badges{display:flex;align-items:center;gap:.5rem;align-self:flex-start;margin-bottom:1.4rem;}
.verified-stamp-wrap{position:absolute;right:1.1rem;bottom:1.1rem;transform:rotate(-9deg);pointer-events:none;}
.verified-stamp-ring{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem;width:76px;height:76px;border-radius:50%;border:2px solid var(--accent);box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 5px var(--accent);color:var(--accent);opacity:.88;}
.verified-stamp-ring svg{flex:none;}
.verified-stamp-text{font-family:'Public Sans',sans-serif;font-weight:800;font-size:.5rem;line-height:1.2;letter-spacing:.06em;text-align:center;text-transform:uppercase;}
.face.back .tag{background:var(--accent-dark);}
.face .content{font-family:'Public Sans',system-ui,sans-serif;font-weight:500;font-size:1.3rem;line-height:1.45;flex:1;display:flex;align-items:center;overflow-wrap:anywhere;}
.face .idx{position:absolute;top:.9rem;right:1rem;font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:var(--ink-soft);}
.face.back{transform:rotateY(180deg);}
.controls{display:flex;justify-content:center;align-items:center;gap:.6rem;flex-wrap:wrap;}
.btn{font-family:'Public Sans',sans-serif;font-weight:600;font-size:.95rem;border-radius:8px;border:1.5px solid var(--accent-dark);background:var(--accent);color:#fff;padding:.7em 1.3em;min-height:44px;cursor:pointer;}
.btn:hover{background:var(--accent-dark);}
.btn.secondary{background:var(--card);color:var(--accent-dark);}
.btn.secondary:hover{background:var(--paper-alt);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.hint{color:var(--ink-soft);font-size:.9rem;text-align:center;}
#sr-status{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
@media (prefers-reduced-motion: reduce){.card-inner{transition:none;}}
@media (max-width:500px){.face .content{font-size:1.2rem;}}
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<header class="top">
<span class="eyebrow">Catalog Drawer</span>
<h1>flashcards</h1>
</header>
<main id="main">
<div class="deck-meta"><span class="mono" id="progress"></span></div>
<div class="stage">
<button type="button" class="card-face" id="card-btn" aria-pressed="false">
<span class="card-inner" id="card-inner">
<span class="face front"><span class="idx mono" id="idx-front"></span><span class="face-badges"><span class="tag">Question</span></span><span class="content" id="front-text"></span></span>
<span class="face back" aria-hidden="true"><span class="idx mono" id="idx-back"></span><span class="face-badges"><span class="tag">Answer</span></span><span class="content" id="back-text"></span><span class="verified-stamp-wrap" aria-hidden="true"><span class="verified-stamp-ring"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="verified-stamp-text">Verified<br>Correct</span></span></span></span>
</span>
</button>
</div>
<div class="controls">
<button type="button" class="btn secondary" id="prev-btn">← Previous</button>
<button type="button" class="btn" id="flip-btn">Flip card</button>
<button type="button" class="btn secondary" id="next-btn">Next →</button>
<button type="button" class="btn secondary" id="shuffle-btn">Shuffle</button>
</div>
<p class="hint">Press <kbd>Space</kbd> or <kbd>Enter</kbd> on the focused card to flip it, and use the ←/→ arrow keys to move between cards.</p>
<div id="sr-status" aria-live="polite"></div>
</main>
<script>
(function(){
"use strict";
var cards = [{"front":"How does the ISO 9000:2005 standard define quality?","back":"Quality is the degree to which a set of inherent characteristics fulfills requirements."},{"front":"Which quality guru is known for the definition of quality as 'fitness for use'?","back":"Joseph Juran."},{"front":"How does Philip Crosby define quality in his management philosophy?","back":"Crosby defines quality as 'conformance to requirements'."},{"front":"What is the primary function of a Cause-and-Effect Diagram?","back":"It is a tool used to identify, sort, and display the possible root causes of a specific problem or quality characteristic."},{"front":"What are two alternative names for the Cause-and-Effect Diagram?","back":"The Ishikawa diagram and the fishbone diagram."},{"front":"In an Ishikawa diagram, what does the 'fish head' represent?","back":"The head represents the specific effect, problem, or planning objective being analyzed."},{"front":"What technique is used in Step 5 of constructing an Ishikawa diagram to identify detailed levels of causes?","back":"Asking a series of 'why' questions to explore deeper contributing factors."},{"front":"What do the '3Ms and P' represent in the context of Ishikawa diagram categories?","back":"Methods, materials, machinery, and people."},{"front":"In service-oriented processes, what four categories are represented by the '4Ps' on a fishbone diagram?","back":"Policies, procedures, people, and plant."},{"front":"What is the first step in the construction of a Cause-and-Effect Diagram?","back":"Identify and clearly define the outcome or effect to be analyzed."},{"front":"What is a major benefit of using a positive effect as the focus of an Ishikawa diagram?","back":"It fosters pride and ownership over productive areas and encourages group participation."},{"front":"In Ishikawa analysis, what might a thick cluster of items in a single category suggest?","back":"It indicates a need for further study or more detailed data collection in that area."},{"front":"What is the primary purpose of a Control Chart in statistical process control?","back":"To determine whether a process is in a state of statistical control or if it is being influenced by special causes of variation."},{"front":"Who originally developed the control chart in the early 1920s?","back":"Walter Shewhart."},{"front":"What is the difference between common cause and special cause variation?","back":"Common cause is inherent in the system design, while special cause is result of unusual circumstances or events."},{"front":"In a control chart, what does the Center Line represent?","back":"The target value or the historical process average calculated from the data."},{"front":"How are the upper and lower control limits typically calculated for a process?","back":"They are usually set at plus and minus three standard deviations ($3\\sigma$) from the center line."},{"front":"What is the specific purpose of an 'X-bar chart'?","back":"It monitors the process location over time based on the average of subgroup observations."},{"front":"What does an 'R chart' monitor in a manufacturing process?","back":"The variation or spread between observations within a subgroup over time."},{"front":"How do control limits differ from specification limits?","back":"Control limits indicate process capability and stability, while specification limits define the required performance standards."},{"front":"Which type of control chart is most appropriate for quantitative measurements like weight or thickness?","back":"Variable control charts."},{"front":"Under what condition should a team use an 'np-chart'?","back":"When they are counting the number of defective items in a batch where the occurrence is not rare."},{"front":"What is the function of a 'c-chart' in quality control?","back":"To monitor the total number of nonconformities in units of a constant size."},{"front":"What distinguishes a 'u-chart' from a 'c-chart'?","back":"The u-chart measures the number of nonconformities per unit in samples of varying size."},{"front":"Why are variable control charts preferred as 'leading indicators' of quality problems?","back":"They can detect slight process changes and warn of potential errors before rejects are actually produced."},{"front":"What is a check sheet?","back":"A structured form used to easily gather, record, and analyze data based on simple observation."},{"front":"What is the specific goal of a Phase II check sheet compared to Phase I?","back":"Phase II provides more specific data on sub-processes or tasks within categories identified as problematic in Phase I."},{"front":"What are the three main types of check sheets defined in quality excellence guides?","back":"Defect Location, Tally, and Defect Cause check sheets."},{"front":"What is a major visual strength of using a check sheet?","back":"It reveals underlying patterns in data without the need for complicated calculations."},{"front":"What is a Histogram?","back":"A bar chart that graphically represents the frequency distribution of continuous data within specific ranges."},{"front":"How do the bars in a histogram represent the data differently than those in a standard bar chart?","back":"Histogram bars touch to show a continuous flow across intervals, while bar chart bars are separated to show distinct categories."},{"front":"What does a Pareto chart help an organization prioritize?","back":"It helps prioritize issues or factors based on the principle that a minority of causes often influences the majority of consequences."},{"front":"What is the '80/20 rule' in Pareto analysis?","back":"The principle that roughly $80\\%$ of problems are caused by $20\\%$ of the potential sources."},{"front":"On a Pareto chart, what are the few most significant factors called?","back":"The 'vital few'."},{"front":"What is the primary purpose of a Scatter Diagram?","back":"To analyze and visualize the nature and strength of the relationship between two variables."},{"front":"In a scatter plot, what is indicated by an upward-sloping pattern of data points?","back":"A positive correlation between the variables."},{"front":"What is stratification in the context of quality control?","back":"Dividing or grouping data into distinct categories to identify specific patterns or sources of variation."},{"front":"What is the ultimate goal of the DMAIC process in Six Sigma?","back":"To improve processes systematically through the phases of Define, Measure, Analyze, Improve, and Control."},{"front":"Which phase of DMAIC utilizes histograms and Pareto charts to prioritize issues?","back":"The Analyze phase."},{"front":"How does the 'Poka-yoke' technique contribute to process improvement?","back":"It focuses on 'mistake-proofing' a process to prevent human or mechanical errors."},{"front":"What is the philosophy of 'Kaizen'?","back":"A strategy for continuous, incremental improvement involving every employee in an organization."},{"front":"What are the four components of the PDCA cycle?","back":"Plan, Do, Check, and Act."},{"front":"In an Ishikawa diagram analysis, which causes should be circled for further investigation?","back":"The causes that the team can take action on."},{"front":"What document is typically used to report on failures and the resulting corrective actions in a professional quality setting?","back":"An 8D Report."},{"front":"What is the purpose of a 'Work Instruction' within a Quality Management System?","back":"To provide specific, detailed steps for an individual to perform a single task correctly."},{"front":"Which quality guru is associated with the 'Total Quality Control' approach and the inclusion of marketing and maintenance?","back":"Armand Feigenbaum."},{"front":"What constant is used to calculate the control limits of an X-bar chart from the average range?","back":"The constant $A_{2}$."},{"front":"Which constant is multiplied by the average range to find the Upper Control Limit ($UCL$) of an R-chart?","back":"The constant $D_{4}$."},{"front":"What does a downward-sloping pattern on a scatter diagram suggest about the relationship between variables?","back":"It indicates a negative correlation."},{"front":"In the '3Ms and P' model, what does 'Machinery' typically encompass?","back":"Tools, equipment, and machines used in the process."},{"front":"What is the primary role of a Six Sigma Black Belt?","back":"To lead complex improvement projects and apply advanced statistical tools to achieve sustainable results."},{"front":"How can a computer collecting real-time data improve the use of control charts?","back":"It can detect slight changes instantly and warn operators to prevent errors before they occur."},{"front":"In the context of the Pareto principle, what are the many remaining factors that contribute little to the problem called?","back":"The 'useful many'."},{"front":"What is the first action to take when a control chart signal indicates an out-of-control situation?","back":"Investigate the root cause and take corrective action to bring the process back within limits."},{"front":"What is the purpose of 'Operational Definitions' in quality planning?","back":"To provide a clear, unambiguous understanding of the parameters or effects being measured."}];
var order = cards.map(function(_, i){ return i; });
var current = 0;
var cardBtn = document.getElementById("card-btn");
var frontText = document.getElementById("front-text");
var backText = document.getElementById("back-text");
var idxFront = document.getElementById("idx-front");
var idxBack = document.getElementById("idx-back");
var progressEl = document.getElementById("progress");
var prevBtn = document.getElementById("prev-btn");
var nextBtn = document.getElementById("next-btn");
var flipBtn = document.getElementById("flip-btn");
var shuffleBtn = document.getElementById("shuffle-btn");
var srStatus = document.getElementById("sr-status");
function shuffleArray(arr){ var a = arr.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function renderCard(announce){
  var c = cards[order[current]];
  frontText.textContent = c.front;
  backText.textContent = c.back;
  idxFront.textContent = String(current + 1).padStart(3, "0");
  idxBack.textContent = String(current + 1).padStart(3, "0");
  cardBtn.setAttribute("aria-pressed", "false");
  cardBtn.setAttribute("aria-label", "Question: " + c.front + ". Activate to show the answer.");
  progressEl.textContent = "Card " + (current + 1) + " of " + cards.length;
  if (announce) srStatus.textContent = "Card " + (current + 1) + " of " + cards.length + ". Question: " + c.front;
  prevBtn.disabled = cards.length <= 1;
  nextBtn.disabled = cards.length <= 1;
}
function flipCard(){
  var pressed = cardBtn.getAttribute("aria-pressed") === "true";
  var c = cards[order[current]];
  if (pressed){
    cardBtn.setAttribute("aria-pressed", "false");
    cardBtn.setAttribute("aria-label", "Question: " + c.front + ". Activate to show the answer.");
    srStatus.textContent = "Showing question: " + c.front;
  } else {
    cardBtn.setAttribute("aria-pressed", "true");
    cardBtn.setAttribute("aria-label", "Verified answer: " + c.back + ". Activate to show the question.");
    srStatus.textContent = "Showing verified answer: " + c.back;
  }
}
function goTo(delta){
  if (cards.length < 2) return;
  current = (current + delta + cards.length) % cards.length;
  renderCard(true);
}
cardBtn.addEventListener("click", flipCard);
flipBtn.addEventListener("click", function(){ cardBtn.focus(); flipCard(); });
prevBtn.addEventListener("click", function(){ goTo(-1); });
nextBtn.addEventListener("click", function(){ goTo(1); });
shuffleBtn.addEventListener("click", function(){ order = shuffleArray(order); current = 0; renderCard(false); srStatus.textContent = "Deck shuffled. Card 1 of " + cards.length; });
document.addEventListener("keydown", function(e){
  if (e.key === "ArrowLeft"){ e.preventDefault(); goTo(-1); }
  else if (e.key === "ArrowRight"){ e.preventDefault(); goTo(1); }
});
if (cards.length){ renderCard(true); } else { progressEl.textContent = "No cards found."; }
})();
</script>
</body>
</html>
